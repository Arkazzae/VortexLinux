name: Upstream compatibility

on:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/upstream-compatibility.yml"
      - "scripts/**"
      - "appimage/**"
      - "PKGBUILD"
      - ".SRCINFO"
      - "patches/**"
      - "vortex.install"
      - "vortex.sh"
      - "vortex.desktop"
      - "README.md"
      - "LICENSE"
  pull_request:
    paths:
      - ".github/workflows/upstream-compatibility.yml"
      - "scripts/**"
      - "appimage/**"
      - "PKGBUILD"
      - ".SRCINFO"
      - "patches/**"
      - "vortex.install"
      - "vortex.sh"
      - "vortex.desktop"
      - "README.md"
      - "LICENSE"
  schedule:
    - cron: "23 */6 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Vortex tag, branch, commit, latest, or pinned"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read

concurrency:
  group: upstream-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Patch and test Vortex
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      upstream_ref: ${{ steps.prepare.outputs.upstream_ref }}
      upstream_commit: ${{ steps.prepare.outputs.upstream_commit }}
      upstream_url: ${{ steps.prepare.outputs.upstream_url }}
      upstream_changed: ${{ steps.prepare.outputs.upstream_changed }}
    steps:
      - name: Check out compatibility repository
        uses: actions/checkout@v6

      - name: Select upstream revision and apply patches
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.upstream_ref }}
        run: |
          if [[ -n "$REQUESTED_REF" ]]; then
            upstream_ref="$REQUESTED_REF"
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            upstream_ref="latest"
          else
            upstream_ref="pinned"
          fi

          scripts/check-upstream-compatibility.sh \
            --ref "$upstream_ref" \
            --worktree "$RUNNER_TEMP/vortex-upstream"

      - name: Set up upstream Node.js
        if: ${{ github.event_name != 'schedule' || steps.prepare.outputs.upstream_changed == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.prepare.outputs.node_version }}
          package-manager-cache: false

      - name: Activate upstream pnpm version
        if: ${{ github.event_name != 'schedule' || steps.prepare.outputs.upstream_changed == 'true' }}
        working-directory: ${{ steps.prepare.outputs.worktree }}
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
          PNPM_VERSION: ${{ steps.prepare.outputs.pnpm_version }}
        run: |
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
          node --version
          pnpm --version

      - name: Install upstream dependencies
        if: ${{ github.event_name != 'schedule' || steps.prepare.outputs.upstream_changed == 'true' }}
        working-directory: ${{ steps.prepare.outputs.worktree }}
        env:
          CI: "1"
          HUSKY: "0"
          VORTEX_SKIP_SUBMODULES: "1"
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/create-env-file.mjs

      - name: Run patch tests and renderer typecheck
        if: ${{ github.event_name != 'schedule' || steps.prepare.outputs.upstream_changed == 'true' }}
        run: scripts/run-upstream-tests.sh "${{ steps.prepare.outputs.worktree }}"

  prepare-release:
    name: Prepare release metadata
    needs: compatibility
    if: >-
      ${{
        needs.compatibility.result == 'success' &&
        (
          github.event_name != 'workflow_dispatch' ||
          inputs.upstream_ref == 'pinned' ||
          inputs.upstream_ref == 'latest'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.metadata.outputs.changed }}
      release_needed: ${{ steps.metadata.outputs.release_needed }}
      package_version: ${{ steps.metadata.outputs.package_version }}
      package_revision: ${{ steps.metadata.outputs.package_revision }}
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v6

      - name: Prepare tested package metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_CHANGED: ${{ needs.compatibility.outputs.upstream_changed }}
          UPSTREAM_REF: ${{ needs.compatibility.outputs.upstream_ref }}
          UPSTREAM_COMMIT: ${{ needs.compatibility.outputs.upstream_commit }}
        run: |
          if [[ "$UPSTREAM_CHANGED" == true ]]; then
            GITHUB_OUTPUT='' scripts/update-upstream-version.sh \
              --ref "$UPSTREAM_REF" \
              --commit "$UPSTREAM_COMMIT"
            metadata_changed=true
          else
            metadata_changed=false
          fi

          package_version="$(sed -n 's/^pkgver=//p' PKGBUILD)"
          package_release="$(sed -n 's/^pkgrel=//p' PKGBUILD)"
          if [[ -z "$package_version" || -z "$package_release" ]]; then
            echo 'Unable to read the pinned package revision' >&2
            exit 1
          fi
          package_revision="${package_version}-${package_release}"

          # A failed publish may leave master pinned to the tested version but
          # without a complete release. Treat that as pending work so the next
          # scheduled run rebuilds and retries without maintainer involvement.
          release_needed=true
          if [[ "$metadata_changed" == false ]]; then
            release_json="$RUNNER_TEMP/release.json"
            if gh release view "v${package_revision}" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets > "$release_json" 2>/dev/null; then
              required_assets=(
                "vortex-linux-${package_version}-x86_64.pkg.tar.zst"
                "vortex-linux-${package_version}-x86_64.pkg.tar.zst.sha256"
                "Vortex-${package_version}-x86_64.AppImage"
                "Vortex-${package_version}-x86_64.AppImage.sha256"
              )
              release_needed=false
              for required_asset in "${required_assets[@]}"; do
                if ! jq -e --arg name "$required_asset" \
                    '.assets | any(.name == $name)' "$release_json" >/dev/null; then
                  release_needed=true
                  break
                fi
              done
            fi
          fi

          printf 'changed=%s\n' "$metadata_changed" >> "$GITHUB_OUTPUT"
          printf 'release_needed=%s\n' "$release_needed" >> "$GITHUB_OUTPUT"
          printf 'package_version=%s\n' "$package_version" >> "$GITHUB_OUTPUT"
          printf 'package_revision=%s\n' "$package_revision" >> "$GITHUB_OUTPUT"

      - name: Upload tested package metadata
        uses: actions/upload-artifact@v4
        with:
          name: vortex-release-source
          path: |
            PKGBUILD
            .SRCINFO
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  build-package:
    name: Build Linux release artifacts
    needs:
      - compatibility
      - prepare-release
    if: >-
      ${{
        needs.compatibility.result == 'success' &&
        needs.prepare-release.result == 'success' &&
        (
          github.event_name == 'pull_request' ||
          (
            github.ref == 'refs/heads/master' &&
            (
              (
                github.event_name == 'push' &&
                needs.prepare-release.outputs.release_needed == 'true'
              ) ||
              (
                github.event_name == 'schedule' &&
                needs.prepare-release.outputs.release_needed == 'true'
              ) ||
              (
                github.event_name == 'workflow_dispatch' &&
                (
                  inputs.upstream_ref == 'pinned' ||
                  (
                    inputs.upstream_ref == 'latest' &&
                    needs.prepare-release.outputs.release_needed == 'true'
                  )
                )
              )
            )
          )
        )
      }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    timeout-minutes: 90
    outputs:
      package_name: ${{ steps.package.outputs.package_name }}
      package_version: ${{ steps.package.outputs.package_version }}
      package_revision: ${{ steps.package.outputs.package_revision }}
      package_archive: ${{ steps.package.outputs.package_archive }}
      checksum_file: ${{ steps.package.outputs.checksum_file }}
      appimage_archive: ${{ steps.appimage.outputs.appimage_archive }}
      appimage_checksum: ${{ steps.appimage.outputs.appimage_checksum }}
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v6

      - name: Use tested package metadata
        uses: actions/download-artifact@v5
        with:
          name: vortex-release-source
          path: release-source

      - name: Install tested package metadata
        run: install -m644 release-source/PKGBUILD release-source/.SRCINFO .

      - name: Install package dependencies
        run: |
          mapfile -t build_dependencies < <(
            sed -nE 's/^\t(depends|makedepends) = ([^<>=: ]+).*$/\2/p' .SRCINFO |
              sort -u
          )
          if ((${#build_dependencies[@]} == 0)); then
            echo 'No package dependencies found in .SRCINFO' >&2
            exit 1
          fi

          pacman -Syu --needed --noconfirm "${build_dependencies[@]}"
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          df -h "$GITHUB_WORKSPACE"

      - name: Build Arch package
        id: package
        run: |
          chown builder:builder "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          runuser --user builder -- env \
            HOME=/home/builder \
            XDG_CACHE_HOME=/home/builder/.cache \
            MAKEFLAGS=-j2 \
            scripts/build-arch-package.sh

      - name: Build AppImage
        id: appimage
        run: |
          chown builder:builder "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          runuser --user builder -- env \
            HOME=/home/builder \
            XDG_CACHE_HOME=/home/builder/.cache \
            scripts/build-appimage.sh \
              "dist/${{ steps.package.outputs.package_archive }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vortex-linux-${{ steps.package.outputs.package_version }}
          path: |
            dist/${{ steps.package.outputs.package_archive }}
            dist/${{ steps.package.outputs.checksum_file }}
            dist/${{ steps.appimage.outputs.appimage_archive }}
            dist/${{ steps.appimage.outputs.appimage_checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  test-appimage:
    name: Test AppImage on clean Ubuntu
    needs: build-package
    if: ${{ needs.build-package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: vortex-linux-${{ needs.build-package.outputs.package_version }}
          path: dist

      - name: Verify and start AppImage in a clean container
        run: |
          (
            cd dist || exit 1
            sha256sum --check "${{ needs.build-package.outputs.appimage_checksum }}"
          )
          scripts/test-appimage.sh "dist/${{ needs.build-package.outputs.appimage_archive }}"

  finalize-source:
    name: Record tested upstream release
    needs:
      - compatibility
      - prepare-release
      - build-package
      - test-appimage
    if: >-
      ${{
        needs.test-appimage.result == 'success' &&
        github.ref == 'refs/heads/master' &&
        needs.prepare-release.outputs.release_needed == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Download tested package metadata
        if: ${{ needs.prepare-release.outputs.changed == 'true' }}
        uses: actions/download-artifact@v5
        with:
          name: vortex-release-source
          path: release-source

      - name: Commit the tested version bump
        id: source
        env:
          METADATA_CHANGED: ${{ needs.prepare-release.outputs.changed }}
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          source_commit="$EXPECTED_HEAD"
          if [[ "$METADATA_CHANGED" == true ]]; then
            remote_head="$(git ls-remote origin refs/heads/master | cut -f1)"
            local_head="$(git rev-parse HEAD)"
            if [[ "$remote_head" != "$EXPECTED_HEAD" || "$local_head" != "$EXPECTED_HEAD" ]]; then
              printf '::error::master changed during the build (expected %s, remote %s, local %s). The next scheduled run will retry.\n' \
                "$EXPECTED_HEAD" "$remote_head" "$local_head"
              exit 1
            fi

            install -m644 release-source/PKGBUILD release-source/.SRCINFO .
            git diff --check
            git add PKGBUILD .SRCINFO
            if git diff --cached --quiet; then
              echo 'Expected updated package metadata, but there is nothing to commit' >&2
              exit 1
            fi

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Update Vortex to ${PACKAGE_VERSION}"
            git push origin HEAD:master
            source_commit="$(git rev-parse HEAD)"
          fi

          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
          printf '### Tested packaging source\n\nCommit: `%s`\n' \
            "$source_commit" >> "$GITHUB_STEP_SUMMARY"

  publish-package:
    name: Publish Linux release
    needs:
      - compatibility
      - prepare-release
      - build-package
      - test-appimage
      - finalize-source
    if: >-
      ${{
        needs.finalize-source.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_VERSION: ${{ needs.build-package.outputs.package_version }}
      PACKAGE_REVISION: ${{ needs.build-package.outputs.package_revision }}
      PACKAGE_ARCHIVE: ${{ needs.build-package.outputs.package_archive }}
      CHECKSUM_FILE: ${{ needs.build-package.outputs.checksum_file }}
      APPIMAGE_ARCHIVE: ${{ needs.build-package.outputs.appimage_archive }}
      APPIMAGE_CHECKSUM: ${{ needs.build-package.outputs.appimage_checksum }}
      UPSTREAM_COMMIT: ${{ needs.compatibility.outputs.upstream_commit }}
      SOURCE_COMMIT: ${{ needs.finalize-source.outputs.source_commit }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: vortex-linux-${{ needs.build-package.outputs.package_version }}
          path: dist

      - name: Verify downloaded artifacts
        working-directory: dist
        run: sha256sum --check "$CHECKSUM_FILE" "$APPIMAGE_CHECKSUM"

      - name: Publish the latest release
        id: release
        env:
          RELEASE_TAG: v${{ needs.build-package.outputs.package_revision }}
        run: |
          cat > release-notes.md <<EOF
          Vortex for Linux, built after the compatibility suite passed.

          - Version: \`${PACKAGE_VERSION}\`
          - Package revision: \`${PACKAGE_REVISION}\`
          - Upstream commit: \`${UPSTREAM_COMMIT}\`
          - Packaging source: https://github.com/${GITHUB_REPOSITORY}/tree/${SOURCE_COMMIT}
          - Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ## Arch Linux

          \`\`\`sh
          sha256sum --check ${CHECKSUM_FILE}
          sudo pacman -U ./${PACKAGE_ARCHIVE}
          \`\`\`

          ## Other x86_64 Linux distributions

          Install Wine with your distribution's package manager, then:

          \`\`\`sh
          sha256sum --check ${APPIMAGE_CHECKSUM}
          chmod +x ${APPIMAGE_ARCHIVE}
          ./${APPIMAGE_ARCHIVE}
          \`\`\`
          EOF

          # Release tags include pkgrel and are immutable. Reusing a package
          # revision for a different commit would make normal tag fetches fail.
          target_tag_response="$RUNNER_TEMP/release-tag-response.json"
          target_tag_error="$RUNNER_TEMP/release-tag-error.log"
          if gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              >"$target_tag_response" 2>"$target_tag_error"; then
            target_tag_sha="$(jq -er '.object.sha' "$target_tag_response")"
          elif jq -e '(.status | tostring) == "404"' \
              "$target_tag_response" >/dev/null 2>&1; then
            target_tag_sha=""
          else
            cat "$target_tag_error" >&2
            cat "$target_tag_response" >&2
            exit 1
          fi
          if [[ -n "$target_tag_sha" && "$target_tag_sha" != "$SOURCE_COMMIT" ]]; then
            printf '::error::Release tag %s already points to %s; bump pkgrel before publishing %s.\n' \
              "$RELEASE_TAG" "$target_tag_sha" "$SOURCE_COMMIT"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/$PACKAGE_ARCHIVE" \
              "dist/$CHECKSUM_FILE" \
              "dist/$APPIMAGE_ARCHIVE" \
              "dist/$APPIMAGE_CHECKSUM" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vortex for Linux ${PACKAGE_REVISION}" \
              --notes-file release-notes.md \
              --latest
          elif [[ -n "$target_tag_sha" ]]; then
            gh release create "$RELEASE_TAG" \
              "dist/$PACKAGE_ARCHIVE" \
              "dist/$CHECKSUM_FILE" \
              "dist/$APPIMAGE_ARCHIVE" \
              "dist/$APPIMAGE_CHECKSUM" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Vortex for Linux ${PACKAGE_REVISION}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              "dist/$PACKAGE_ARCHIVE" \
              "dist/$CHECKSUM_FILE" \
              "dist/$APPIMAGE_ARCHIVE" \
              "dist/$APPIMAGE_CHECKSUM" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_COMMIT" \
              --title "Vortex for Linux ${PACKAGE_REVISION}" \
              --notes-file release-notes.md \
              --latest
          fi

          release_url="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json url \
            --jq .url)"
          printf 'release_url=%s\n' "$release_url" >> "$GITHUB_OUTPUT"
          printf '### Published Linux release\n\n[%s](%s)\n' \
            "$RELEASE_TAG" "$release_url" >> "$GITHUB_STEP_SUMMARY"

  compatibility-issue:
    name: Report automatic update failure
    needs:
      - compatibility
      - prepare-release
      - build-package
      - test-appimage
      - finalize-source
      - publish-package
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: "[CI] Automatic Vortex update failed"
      UPSTREAM_REF: ${{ needs.compatibility.outputs.upstream_ref }}
      UPSTREAM_COMMIT: ${{ needs.compatibility.outputs.upstream_commit }}
      UPSTREAM_URL: ${{ needs.compatibility.outputs.upstream_url }}
      RELEASE_NEEDED: ${{ needs.prepare-release.outputs.release_needed }}
      COMPATIBILITY_STATUS: ${{ needs.compatibility.result }}
      PREPARE_STATUS: ${{ needs.prepare-release.result }}
      BUILD_STATUS: ${{ needs.build-package.result }}
      APPIMAGE_STATUS: ${{ needs.test-appimage.result }}
      FINALIZE_STATUS: ${{ needs.finalize-source.result }}
      PUBLISH_STATUS: ${{ needs.publish-package.result }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update, or close the failure issue
        run: |
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)"

          statuses=(
            "$COMPATIBILITY_STATUS"
            "$PREPARE_STATUS"
            "$BUILD_STATUS"
            "$APPIMAGE_STATUS"
            "$FINALIZE_STATUS"
            "$PUBLISH_STATUS"
          )
          failed=false
          for status in "${statuses[@]}"; do
            if [[ "$status" == failure || "$status" == cancelled ]]; then
              failed=true
              break
            fi
          done
          if [[ "$failed" == false ]]; then
            case "$RELEASE_NEEDED" in
              true)
                required_statuses=(
                  "$BUILD_STATUS"
                  "$APPIMAGE_STATUS"
                  "$FINALIZE_STATUS"
                  "$PUBLISH_STATUS"
                )
                for status in "${required_statuses[@]}"; do
                  if [[ "$status" != success ]]; then
                    failed=true
                    break
                  fi
                done
                ;;
              false)
                ;;
              *)
                failed=true
                ;;
            esac
          fi

          if [[ "$failed" == true ]]; then
            issue_body="$(mktemp)"
            printf '%s\n' \
              'The unattended update against the latest stable Vortex release failed.' \
              '' \
              "- Upstream ref: \`${UPSTREAM_REF:-unresolved}\`" \
              "- Upstream commit: \`${UPSTREAM_COMMIT:-unresolved}\`" \
              "- Release: ${UPSTREAM_URL:-unresolved}" \
              "- Release required: \`${RELEASE_NEEDED:-unresolved}\`" \
              "- Patch tests: \`${COMPATIBILITY_STATUS}\`" \
              "- Metadata: \`${PREPARE_STATUS}\`" \
              "- Package build: \`${BUILD_STATUS}\`" \
              "- AppImage smoke test: \`${APPIMAGE_STATUS}\`" \
              "- Source update: \`${FINALIZE_STATUS}\`" \
              "- Release publish: \`${PUBLISH_STATUS}\`" \
              "- Workflow run: ${RUN_URL}" \
              '' \
              'The failed job log identifies the patch, test, build, or publication step that needs attention.' \
              > "$issue_body"

            if [[ -n "$issue_number" ]]; then
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --body-file "$issue_body"
            else
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file "$issue_body"
            fi
          elif [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed \
              --comment "Automatic updates are healthy again for \`${UPSTREAM_REF:-the latest release}\`. [Passing run](${RUN_URL})."
          fi
