name: Build a selected Vortex version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Vortex version with a Linux recipe (for example, 1.16.9 or 2.6.2)"
        required: true
        type: string
      packaging_ref:
        description: "Optional packaging tag, branch, or commit; its version must match"
        required: false
        type: string
      format:
        description: "Artifacts to download"
        required: true
        default: both
        type: choice
        options:
          - both
          - arch
          - appimage

permissions:
  contents: read

jobs:
  build:
    name: Build the selected packaging snapshot
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    outputs:
      artifact_name: vortex-linux-${{ steps.prepare.outputs.package_revision }}-${{ inputs.format }}
      packaging_commit: ${{ steps.prepare.outputs.packaging_commit }}
      recipe_path: ${{ steps.prepare.outputs.recipe_path }}
      appimage_archive: ${{ steps.appimage.outputs.appimage_archive }}
      smoke_supported: ${{ steps.smoke.outputs.supported }}
    steps:
      # Git must be present before checkout so history is available to the selector.
      - name: Install snapshot selection tools
        run: pacman -Syu --needed --noconfirm git python

      - name: Check out packaging history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # The container runs as root while the checkout belongs to the runner's
      # user, and Git refuses to read a repository owned by someone else.
      - name: Let Git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Select and export the matching packaging snapshot
        id: prepare
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PACKAGING_REF: ${{ inputs.packaging_ref }}
          BUILD_FORMAT: ${{ inputs.format }}
        run: |
          arguments=(
            --version "$REQUESTED_VERSION"
            --format "$BUILD_FORMAT"
            --output-dir "$RUNNER_TEMP/vortex-version-build"
            --prepare-only
          )
          if [[ -n "$PACKAGING_REF" ]]; then
            arguments+=(--packaging-ref "$PACKAGING_REF")
          fi
          python3 scripts/build-version.py "${arguments[@]}"

      - name: Check whether the selected recipe provides AppImage tests
        id: smoke
        if: ${{ inputs.format != 'arch' }}
        env:
          SOURCE_DIRECTORY: ${{ steps.prepare.outputs.source_directory }}
        run: |
          if [[ -f "$SOURCE_DIRECTORY/scripts/test-appimage.sh" ]]; then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
          else
            echo 'supported=false' >> "$GITHUB_OUTPUT"
            echo 'AppImage runtime check skipped: the selected historical recipe does not provide scripts/test-appimage.sh.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install the selected snapshot's dependencies
        env:
          SOURCE_DIRECTORY: ${{ steps.prepare.outputs.source_directory }}
          OUTPUT_DIRECTORY: ${{ steps.prepare.outputs.output_directory }}
        run: |
          mapfile -t build_dependencies < <(
            sed -nE 's/^[[:space:]]+(depends|makedepends)(_x86_64)? = ([^<>=: ]+).*$/\3/p' \
              "$SOURCE_DIRECTORY/.SRCINFO" | sort -u
          )
          if ((${#build_dependencies[@]} == 0)); then
            echo 'No package dependencies found in the selected .SRCINFO' >&2
            exit 1
          fi
          pacman -S --needed --noconfirm -- "${build_dependencies[@]}"
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$OUTPUT_DIRECTORY"
          df -h "$OUTPUT_DIRECTORY"

      # AppImages are assembled from an Arch package, including appimage-only runs.
      - name: Build Arch package from the selected snapshot
        id: package
        env:
          SOURCE_DIRECTORY: ${{ steps.prepare.outputs.source_directory }}
          OUTPUT_DIRECTORY: ${{ steps.prepare.outputs.output_directory }}
        run: |
          chown builder:builder "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          runuser --user builder -- env \
            HOME=/home/builder \
            XDG_CACHE_HOME=/home/builder/.cache \
            MAKEFLAGS=-j2 \
            "$SOURCE_DIRECTORY/scripts/build-arch-package.sh" \
              "$OUTPUT_DIRECTORY/artifacts"

      - name: Build AppImage from the selected snapshot
        id: appimage
        if: ${{ inputs.format != 'arch' }}
        env:
          SOURCE_DIRECTORY: ${{ steps.prepare.outputs.source_directory }}
          OUTPUT_DIRECTORY: ${{ steps.prepare.outputs.output_directory }}
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.package_archive }}
        run: |
          chown builder:builder "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          runuser --user builder -- env \
            HOME=/home/builder \
            XDG_CACHE_HOME=/home/builder/.cache \
            "$SOURCE_DIRECTORY/scripts/build-appimage.sh" \
              "$OUTPUT_DIRECTORY/artifacts/$PACKAGE_ARCHIVE" \
              "$OUTPUT_DIRECTORY/artifacts"

      - name: Verify and collect requested artifacts
        env:
          OUTPUT_DIRECTORY: ${{ steps.prepare.outputs.output_directory }}
          BUILD_FORMAT: ${{ inputs.format }}
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.package_archive }}
          PACKAGE_CHECKSUM: ${{ steps.package.outputs.checksum_file }}
          APPIMAGE_ARCHIVE: ${{ steps.appimage.outputs.appimage_archive }}
          APPIMAGE_CHECKSUM: ${{ steps.appimage.outputs.appimage_checksum }}
        run: |
          install -dm755 "$OUTPUT_DIRECTORY/download"
          install -m644 "$OUTPUT_DIRECTORY/build-manifest.json" \
            "$OUTPUT_DIRECTORY/download/"
          cd "$OUTPUT_DIRECTORY/artifacts"
          if [[ "$BUILD_FORMAT" != appimage ]]; then
            sha256sum --check "$PACKAGE_CHECKSUM"
            install -m644 "$PACKAGE_ARCHIVE" "$PACKAGE_CHECKSUM" \
              "$OUTPUT_DIRECTORY/download/"
          fi
          if [[ "$BUILD_FORMAT" != arch ]]; then
            sha256sum --check "$APPIMAGE_CHECKSUM"
            install -m755 "$APPIMAGE_ARCHIVE" "$OUTPUT_DIRECTORY/download/"
            install -m644 "$APPIMAGE_CHECKSUM" "$OUTPUT_DIRECTORY/download/"
          fi

      - name: Upload selected artifacts and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: vortex-linux-${{ steps.prepare.outputs.package_revision }}-${{ inputs.format }}
          path: ${{ steps.prepare.outputs.output_directory }}/download/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  smoke:
    name: Check AppImage using the selected recipe
    needs: build
    if: ${{ inputs.format != 'arch' && needs.build.outputs.smoke_supported == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the selected packaging commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.packaging_commit }}
          persist-credentials: false

      - name: Download the built AppImage
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/vortex-artifacts

      - name: Check the AppImage in a clean Ubuntu container
        env:
          RECIPE_PATH: ${{ needs.build.outputs.recipe_path }}
          APPIMAGE_ARCHIVE: ${{ needs.build.outputs.appimage_archive }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/vortex-artifacts
        run: |
          cd "$ARTIFACT_DIRECTORY"
          sha256sum --check "$APPIMAGE_ARCHIVE.sha256"
          bash "$GITHUB_WORKSPACE/$RECIPE_PATH/scripts/test-appimage.sh" \
            "$ARTIFACT_DIRECTORY/$APPIMAGE_ARCHIVE"
